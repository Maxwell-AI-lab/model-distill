[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "model-distill"
version = "0.1.0"
description = "大模型能力蒸馏流水线 — 将 Kimi/GLM/DeepSeek 能力蒸馏到 Qwen 小模型"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0.0",
    "httpx>=0.24.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "datasets>=2.14.0",
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
train = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "peft>=0.7.0",
    "accelerate>=0.25.0",
    "deepspeed>=0.14.0",
    "trl>=0.7.0",
    "bitsandbytes>=0.41.0",
]
eval = [
    "jieba>=0.42.1",
    "rouge-chinese>=1.0.3",
    "nltk>=3.8.1",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
]

[project.scripts]
distill = "distill.cli:main"

[tool.setuptools.packages.find]
include = ["distill*"]

[tool.ruff]
line-length = 120
target-version = "py39"
